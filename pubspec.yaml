name: riverpod_action_listener
description: "A Riverpod extension package that provides a standardized pattern for handling one-off actions (like API calls) and their UI side effects."
version: 0.0.1
homepage: https://topmoveright.github.io/riverpod_action_listener
repository: https://topmoveright.github.io/riverpod_action_listener
issue_tracker: https://topmoveright.github.io/riverpod_action_listener/issues

topics:
  - riverpod
  - state_management
  - hooks
  - side_effects
  - pattern

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ">=0.18.0 <1.0.0"
  hooks_riverpod: ">=2.3.6 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
